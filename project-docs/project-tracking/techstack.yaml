# Technology Stack Configuration - EscapePlan
# This file defines all technologies, versions, and dependencies for the project
# Always pass this file as context to sub-agents to ensure consistency

$schema: ./schemas/techstack-schema.json

# Core Language & Runtime
language:
  name: TypeScript
  version: "5.5.0+"
  justification: "Type-safe development across full stack (API + Web + Contracts), modern async/await, ESM modules"

# Primary Frameworks
framework:
  backend:
    name: Fastify
    version: "5.6.1+"
    justification: "High-performance async API framework with plugin architecture, WebSocket support via Socket.IO"
  frontend:
    name: SvelteKit
    version: "2.43.0+"
    justification: "Modern SSR framework with file-based routing, Svelte 5 runes for reactive state"
  ui:
    name: Tailwind CSS + DaisyUI
    version: "4.1.13+ / 5.1.25+"
    justification: "Utility-first CSS with pre-built components, dark mode support, mobile-first responsive design"

# Database
database:
  primary:
    name: SQLite
    version: "WAL mode via better-sqlite3 9.6.0+"
    justification: "Embedded database for offline-first Raspberry Pi deployment, zero-config, reliable ACID transactions"
  orm:
    name: Drizzle ORM
    version: "0.44.5+"
    justification: "TypeScript-first ORM with type inference, schema migrations via drizzle-kit 0.31.5+"

# Runtime Environment
runtime:
  nodejs:
    version: "24 LTS"
    justification: "Long-term support, modern async features, native ES modules"
  platform:
    production: "Raspberry Pi OS Bookworm 64-bit"
    development: "pnpm workspace monorepo"

# Package Management
package_manager:
  name: pnpm
  version: "10.12.4"
  workspace: true
  justification: "Fast, disk-efficient, strict dependency resolution, workspace support for monorepo"

# Testing Framework
testing:
  unit:
    name: Vitest
    version: "1.5.0+ (API) / 1.6.1+ (Web)"
    plugins:
      - "@testing-library/svelte 5.2.8+"
      - "@testing-library/jest-dom 6.9.0+"
      - "@testing-library/user-event 14.6.1+"
      - "jsdom 27.0.0+"
    justification: "Vite-native test runner, fast, ESM support, compatible with Svelte 5"
  e2e:
    name: Playwright
    version: "TBD (planned for Phase 6)"
    justification: "Cross-browser testing for PWA validation"
  linting:
    - name: TypeScript compiler
      version: "5.5.0+"
      command: "tsc --noEmit"
    - name: svelte-check
      version: "4.0.0+"
      command: "svelte-check --tsconfig ./tsconfig.json"

# Authentication & Authorization
auth:
  framework:
    name: Better Auth
    version: "1.3.24+"
    justification: "TypeScript-first auth library, Drizzle adapter, session management, RBAC support"
  password_hashing:
    name: Argon2id
    version: "0.40.3 (argon2 npm package)"
    justification: "Memory-hard hashing algorithm, resistant to GPU attacks"
  session_storage: "HttpOnly cookies (better-auth.session_token)"
  rbac: "Database-driven via roles, permissions, role_permissions tables"

# Real-Time Communication
realtime:
  library:
    name: Socket.IO
    version: "4.8.1+ (server) / 4.8.1+ (client)"
    justification: "WebSocket abstraction with fallbacks, room support, event-driven architecture"
  events:
    - session:update
    - dashboard:update
    - timer:update
    - bookings:update
    - session:command
  offline_support: "Command queueing in Svelte stores, replay on reconnect"

# Media Processing
media:
  video:
    name: ffmpeg
    version: "7.x"
    wrapper: "fluent-ffmpeg 2.1.3+"
    justification: "RTSP→HLS transcoding for camera streams, video metadata extraction"
  images:
    name: Sharp
    version: "0.34.4+"
    justification: "High-performance image processing, WebP conversion, thumbnail generation"

# Security & Encryption
security:
  credentials:
    name: libsodium (sodium-native)
    version: "5.0.9+"
    justification: "Camera credential encryption, secure key management"
  environment_detection:
    method: "Filesystem + systemd inspection (zero-config)"
    production_paths: "/opt/escapeplan/ or /var/lib/escapeplan/"

# Logging & Observability
logging:
  library:
    name: Winston
    version: "3.18.3+"
    plugins:
      - winston-daily-rotate-file: "5.0.0+"
    justification: "Production-grade logging with rotation, alert rule integration"
  storage: "Database-backed (systemLogs, alerts, alertRules tables)"

# PWA & Offline Support
pwa:
  service_worker:
    name: Vite PWA for SvelteKit
    version: "@vite-pwa/sveltekit 1.0.0+"
    workbox: "7.3.0+"
    justification: "Offline-first caching, automatic updates, manifest generation"
  install_target: "iOS/Android tablets, desktop control room"

# Build & Development Tools
dev_tools:
  bundler:
    backend: "tsup 8.2.4+ (ESM output)"
    frontend: "Vite 7.1.0+ (SvelteKit native)"
  transpiler: "tsx 4.7.2+ (dev hot-reload)"
  adapter: "@sveltejs/adapter-auto 6.0.0+"
  pre_commit: false
  css_processing:
    - "@tailwindcss/vite 4.1.13+"
    - "@tailwindcss/postcss 4.1.13+"
    - "postcss 8.5.6+"

# Production Dependencies (Core)
dependencies:
  core:
    # Backend API
    - fastify@^5.6.1
    - "@fastify/cors@^10.0.1"
    - "@fastify/multipart@^9.2.1"
    - "@fastify/static@^8.2.0"
    - socket.io@^4.8.1

    # Database & ORM
    - drizzle-orm@^0.44.5
    - better-sqlite3@^9.6.0

    # Authentication
    - better-auth@^1.3.24
    - argon2@^0.40.3

    # Validation
    - zod@^3.23.8
    - drizzle-zod@^0.8.3

    # Media Processing
    - sharp@^0.34.4
    - fluent-ffmpeg@^2.1.3

    # Security
    - sodium-native@^5.0.9

    # Logging
    - winston@^3.18.3
    - winston-daily-rotate-file@^5.0.0

    # Utilities
    - nanoid@^5.0.7
    - ulid@^3.0.1
    - tar@^7.5.1

    # Avatar Generation
    - "@dicebear/core@^9.2.4"
    - "@dicebear/bottts@^9.2.4"

    # Frontend Core
    - svelte@^5.39.0
    - "@sveltejs/kit@^2.43.0"
    - socket.io-client@^4.8.1
    - workbox-window@^7.3.0
    - date-fns@^3.6.0

    # UI Framework
    - tailwindcss@^4.1.13
    - daisyui@^5.1.25

  dev:
    # TypeScript
    - typescript@^5.5.0
    - "@types/node@^20.11.30"
    - "@types/better-sqlite3@^7.6.5"
    - "@types/fluent-ffmpeg@^2.1.27"
    - "@types/tar@^6.1.13"

    # Build Tools
    - tsup@^8.2.4
    - tsx@^4.7.2
    - drizzle-kit@^0.31.5
    - vite@^7.1.0
    - "@sveltejs/vite-plugin-svelte@^6.0.0"
    - "@vite-pwa/sveltekit@^1.0.0"

    # Tailwind
    - "@tailwindcss/vite@^4.1.13"
    - "@tailwindcss/postcss@^4.1.13"
    - postcss@^8.5.6

    # Testing
    - vitest@^1.5.0
    - "@testing-library/svelte@^5.2.8"
    - "@testing-library/jest-dom@^6.9.0"
    - "@testing-library/user-event@^14.6.1"
    - jsdom@^27.0.0

    # Svelte Tooling
    - svelte-check@^4.0.0
    - "@sveltejs/adapter-auto@^6.0.0"

    # UI Dev
    - "@fontsource/fira-mono@^5.0.0"
    - "@neoconfetti/svelte@^2.0.0"

# API Standards
api_standards:
  format: REST
  documentation: "FastifySwagger (OpenAPI 3.0)"
  authentication: "Better Auth (session cookies)"
  authorization: "Database-driven RBAC (roles, permissions, role_permissions)"
  real_time: "Socket.IO events"
  versioning: "URI-based (/api/v1)"

# Code Quality Standards
quality_standards:
  test_coverage_minimum: 80
  type_hints: required
  docstrings: recommended
  max_line_length: 120
  formatting: "Prettier + ESLint (project defaults)"
  svelte_check: required
  strict_mode: true

# Monorepo Structure
monorepo:
  workspace_manager: pnpm
  packages:
    - name: "@escapeplan/contracts"
      location: "packages/contracts"
      purpose: "Shared types, Drizzle schema, validation, runtime detection"
      exports:
        - "Drizzle schema (31+ tables)"
        - "Zod validation schemas"
        - "Runtime environment detection"
        - "Path resolution (dev/prod)"
        - "System settings types"
        - "RBAC type definitions"

    - name: "escapeplan-api"
      location: "apps/escapeplan-api"
      purpose: "Fastify backend API with Socket.IO"
      dependencies:
        - "@escapeplan/contracts (workspace)"
        - "Fastify ecosystem"
        - "Better Auth"
        - "Drizzle ORM + better-sqlite3"

    - name: "escapeplan-web"
      location: "apps/escapeplan-web"
      purpose: "SvelteKit PWA operator console"
      dependencies:
        - "@escapeplan/contracts (workspace)"
        - "SvelteKit + Svelte 5"
        - "Tailwind CSS + DaisyUI"
        - "Socket.IO client"

  build_order: "contracts → api → web"

# Environment Configuration
environments:
  local:
    description: "pnpm workspace with hot-reload (tsx watch, vite dev)"
    database: "SQLite at apps/escapeplan-api/data/escapeplan.db"
    api_port: 4000
    web_port: 5173

  production:
    description: "Raspberry Pi 5 with systemd services, nginx reverse proxy"
    database: "SQLite WAL mode at /var/lib/escapeplan/escapeplan.db"
    deployment: ".deb package with auto-migrations"
    networking: "hostapd + dnsmasq (10.10.10.0/24 subnet)"
    domain: "escapeplan.local (mDNS via avahi)"
    services:
      - escapeplan-api.service (port 4000)
      - escapeplan-ffmpeg@.service (camera workers)
    web_server: "nginx 1.29.1+ with self-signed TLS"

# Hard Rules for Sub-agents
hard_rules:
  - "NEVER use mock or placeholder data - always load from database or seeds"
  - "ALWAYS use Drizzle ORM for database operations - no raw SQL except in specific helpers"
  - "ALWAYS reference @escapeplan/contracts for shared types and schema"
  - "ALWAYS use Better Auth session enrichment for user context (permissions, role, user_type)"
  - "ALWAYS check user_type field for operator/customer separation"
  - "ALWAYS use database-driven RBAC (roles → role_permissions → permissions tables)"
  - "NEVER bypass permission checks with hardcoded role strings"
  - "ALWAYS use TypeScript strict mode with full type coverage"
  - "ALWAYS use Svelte 5 runes ($state, $derived, $effect) - not legacy stores"
  - "ALWAYS handle offline scenarios (command queueing, cached data)"
  - "ALWAYS use singular table names per Better Auth v1.3+ conventions (user, session, account, verification)"
  - "NEVER commit .env files or hardcoded credentials"
  - "ALWAYS use environment auto-detection (@escapeplan/contracts/runtime) - no NODE_ENV"
  - "ALWAYS validate with Zod schemas before database operations"
  - "ALWAYS use HttpOnly cookies for auth - no localStorage tokens"
  - "ALWAYS test database triggers enforce user_type/role boundaries"

# Version Control
version_control:
  system: git
  repository: "https://github.com/kryptobaseddev/escapeplan-app.git"
  branching_strategy: "feature-branch with main as production"
  commit_message_format: "conventional-commits"

# Deployment Strategy
deployment:
  packaging: ".deb for Raspberry Pi OS"
  migrations: "Auto-applied on production startup via Drizzle Kit"
  assets: "Sharp-optimized images, ffmpeg-processed videos"
  backups: "Automated nightly via tar + USB mount"
  updates: "OTA when WAN available, manual .deb otherwise"

# Platform-Specific Considerations
platform_notes:
  raspberry_pi:
    - "Optimize for ARM64 architecture"
    - "Limit concurrent HLS streams (Pi 5 can handle ~4 simultaneous 720p)"
    - "Use H.264 copy mode where possible (avoid re-encoding)"
    - "Monitor CPU/memory via systemHealth table"
    - "Store assets on SD card or USB drive (/var/lib/escapeplan/assets/)"

  offline_first:
    - "All features work without internet"
    - "Clock sync via chrony on boot"
    - "mDNS for local discovery (escapeplan.local)"
    - "PWA caching for operator console"
    - "Command queue replays on Socket.IO reconnect"

# Notes
notes:
  - "This file is the single source of truth for technology choices"
  - "Update versions after successful testing and team approval"
  - "All sub-agents must reference this file for technology decisions"
  - "Monorepo build order enforced via workspace dependencies"
  - "Zero-configuration deployment: paths auto-detected, settings seeded"
  - "Auth system modernized: user table (not operators), user_type field, database RBAC"
  - "Better Auth v1.3.24+ with native singular table names and additionalFields"
  - "Customer portal ready: user_type separation, route guards, permission scoping"
