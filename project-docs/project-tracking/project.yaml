# EscapePlan Project Configuration
# This file defines the system architecture, components, and agent workflows
# Always pass this file as context to agents for architectural decisions

$schema: ./schemas/project-schema.json

# ==============================================================================
# PROJECT METADATA
# ==============================================================================
project:
  name: EscapePlan
  version: "0.1.0"
  description: "Offline-first escape room management suite for a Raspberry Pi-hosted network"
  goal: "Ship a Pi-hosted MVP that lets operators manage bookings and run games with reliable video, timers, and hints entirely offline"
  architecture_style: hybrid  # Monorepo with monolithic backend + PWA frontend
  overview_path: project-docs/project-overview.md
  current_phase: PHASE_3

# ==============================================================================
# COMMANDS - Key commands agents should run
# ==============================================================================
commands:
  # Project Tracking
  validate: "./project-tracker validate"
  quick_check: "./project-tracker quick-check"

  # Workspace Build
  build_all: "pnpm -r run build"
  build_contracts: "pnpm --filter @escapeplan/contracts build"
  build_api: "pnpm --filter escapeplan-api build"
  build_web: "pnpm --filter escapeplan-web build"

  # Development
  dev_all: "pnpm dev"  # Starts both API (4000) and Web (5173)
  dev_api: "pnpm --filter escapeplan-api dev"
  dev_web: "pnpm --filter escapeplan-web dev"

  # Database
  db_seed: "pnpm --filter escapeplan-api db:seed"
  db_seed_fresh: "pnpm --filter escapeplan-api db:seed:fresh"
  db_seed_settings: "pnpm --filter escapeplan-api db:seed:settings"

  # Testing
  test_all: "pnpm -r run test"
  test_api: "pnpm --filter escapeplan-api test"
  test_web: "pnpm --filter escapeplan-web test"

  # Type Checking
  lint_all: "pnpm -r run lint"
  check_web: "pnpm --filter escapeplan-web check"

  # Deployment
  build_deb: "pnpm run build:deb"

# ==============================================================================
# COMPONENTS - System architecture breakdown
# ==============================================================================
components:
  contracts_package:
    description: "Shared TypeScript types, Drizzle schema, runtime detection, and validation"
    responsibilities:
      - "Define Drizzle schema (31+ tables) as single source of truth"
      - "Export Zod validation schemas for API request/response"
      - "Provide runtime environment detection (dev vs prod, no NODE_ENV)"
      - "Export path resolution functions (database, assets, backups, logs)"
      - "Define system settings types (database-backed configuration)"
      - "Export RBAC type definitions (roles, permissions)"
    technology: "TypeScript 5.5+ with Drizzle ORM 0.44.5+"
    location: "packages/contracts"
    dependencies: []
    exports:
      - "Drizzle schema and types"
      - "Zod validation schemas"
      - "Runtime detection functions"
      - "Path resolution utilities"
      - "RBAC type definitions"
    consumers:
      - "escapeplan_api"
      - "escapeplan_web"

  escapeplan_api:
    description: "Fastify backend API with Better Auth, Socket.IO, and media processing"
    responsibilities:
      - "Expose REST API for CRUD operations (games, bookings, sessions, users)"
      - "Handle authentication via Better Auth with Argon2id password hashing"
      - "Manage database-driven RBAC (roles, permissions, role_permissions)"
      - "Broadcast real-time events via Socket.IO (session updates, timer ticks)"
      - "Process camera streams (RTSP→HLS via ffmpeg)"
      - "Optimize images via Sharp (WebP conversion, thumbnails)"
      - "Rotate logs via Winston with daily rotation"
      - "Store and enforce alert rules"
    technology: "Fastify 5.6.1+ with Socket.IO 4.8.1+, Better Auth 1.3.24+"
    location: "apps/escapeplan-api"
    dependencies:
      - "contracts_package"
    exports:
      - "REST API endpoints (/api/*)"
      - "Socket.IO server (session, dashboard, timer events)"
      - "HLS camera streams"
    consumers:
      - "escapeplan_web"
      - "Mobile devices (operator tablets)"

  escapeplan_web:
    description: "SvelteKit PWA operator console with real-time updates"
    responsibilities:
      - "Render operator dashboard with active sessions grid"
      - "Provide game runner interface (timer, hints, puzzle tracking)"
      - "Display bookings calendar with conflict detection"
      - "Show system health dashboard (logs, alerts, network, storage)"
      - "Manage users, roles, permissions, cameras, games via admin UI"
      - "Connect to Socket.IO for real-time session/timer updates"
      - "Queue commands offline and replay on reconnect"
      - "Cache UI shell and assets via service worker (PWA)"
    technology: "SvelteKit 2.43.0+ with Svelte 5.39.0, Tailwind CSS 4.1.13+, DaisyUI 5.1.25+"
    location: "apps/escapeplan-web"
    dependencies:
      - "contracts_package"
      - "escapeplan_api"
    exports:
      - "Operator PWA (installable on tablets)"
      - "Room display pages (/{game.slug})"
    consumers:
      - "Operators (tablets, desktops)"
      - "Room displays (kiosks)"

  database:
    description: "SQLite embedded database with Drizzle ORM"
    responsibilities:
      - "Persist all application data (31+ tables)"
      - "Enforce user_type/role boundaries via database triggers"
      - "Store encrypted camera credentials (libsodium)"
      - "Track system logs, alerts, and alert rules"
      - "Maintain Better Auth sessions (user, session, account, verification tables)"
    technology: "SQLite WAL mode with better-sqlite3 9.6.0+"
    location: "apps/escapeplan-api/data/escapeplan.db (dev) or /var/lib/escapeplan/escapeplan.db (prod)"
    dependencies: []
    exports:
      - "Database file (SQLite)"
      - "Schema migrations (Drizzle Kit)"
    consumers:
      - "escapeplan_api"

  ffmpeg_workers:
    description: "Background ffmpeg processes for camera stream transcoding"
    responsibilities:
      - "Transcode RTSP camera streams to HLS format"
      - "Generate .m3u8 playlists and .ts segments"
      - "Monitor stream health and restart on failure"
      - "Support MJPEG and ONVIF protocols"
    technology: "ffmpeg 7.x via fluent-ffmpeg 2.1.3+"
    location: "Managed by escapeplan-api, systemd service in production"
    dependencies:
      - "escapeplan_api"
    exports:
      - "HLS streams (.m3u8 playlists)"
    consumers:
      - "escapeplan_web (camera mosaic)"
      - "Game runner (live feed)"

# ==============================================================================
# DATA FLOW - Key operation flows
# ==============================================================================
data_flow:
  user_authentication:
    - step: 1
      component: escapeplan_web
      action: "User submits email + password via login form"
    - step: 2
      component: escapeplan_api
      action: "Better Auth validates credentials against user table"
    - step: 3
      component: escapeplan_api
      action: "Generate session token, enrich with user_type + role_id + permissions"
    - step: 4
      component: escapeplan_api
      action: "Set HttpOnly cookie (better-auth.session_token)"
    - step: 5
      component: escapeplan_web
      action: "Store session in Svelte context, redirect to /admin/dashboard"

  start_game_session:
    - step: 1
      component: escapeplan_web
      action: "Operator clicks 'Start Session' on booking tile"
    - step: 2
      component: escapeplan_api
      action: "Validate booking exists, no active session for same room"
    - step: 3
      component: database
      action: "Insert new session record with status: 'in_progress'"
    - step: 4
      component: escapeplan_api
      action: "Emit 'session:update' Socket.IO event with session data"
    - step: 5
      component: escapeplan_web
      action: "Dashboard receives event, updates active sessions grid"
    - step: 6
      component: escapeplan_web
      action: "Room display page (/{game.slug}) receives event, starts countdown"

  send_hint:
    - step: 1
      component: escapeplan_web
      action: "Game master clicks hint button in game runner"
    - step: 2
      component: escapeplan_api
      action: "Record hint dispatch in session_hints table"
    - step: 3
      component: escapeplan_api
      action: "Emit 'session:command' Socket.IO event to room channel"
    - step: 4
      component: escapeplan_web
      action: "Room display page displays hint overlay (text/image/video)"
    - step: 5
      component: escapeplan_web
      action: "Game runner updates hint history sidebar"

  camera_stream_setup:
    - step: 1
      component: escapeplan_web
      action: "Admin configures camera (RTSP URL, credentials) in /admin/cameras"
    - step: 2
      component: escapeplan_api
      action: "Encrypt credentials with libsodium (sodium-native)"
    - step: 3
      component: database
      action: "Store encrypted credentials in cameras table"
    - step: 4
      component: escapeplan_api
      action: "Test connection with ffprobe (5s timeout)"
    - step: 5
      component: escapeplan_api
      action: "Spawn ffmpeg worker for RTSP→HLS transcoding"
    - step: 6
      component: ffmpeg_workers
      action: "Generate HLS playlist at /streams/{camera_id}/stream.m3u8"
    - step: 7
      component: escapeplan_web
      action: "Load HLS stream in <video> tag via dashboard camera mosaic"

# ==============================================================================
# INTEGRATIONS
# ==============================================================================
integrations:
  internal:
    - source: escapeplan_web
      target: escapeplan_api
      protocol: "HTTP/REST"
      pattern: "Request-Response"
      description: "CRUD operations for all resources"

    - source: escapeplan_web
      target: escapeplan_api
      protocol: "WebSocket (Socket.IO)"
      pattern: "Pub-Sub"
      description: "Real-time session updates, timer ticks, dashboard events"

    - source: escapeplan_api
      target: database
      protocol: "SQLite via Drizzle ORM"
      pattern: "Repository"
      description: "All data persistence operations"

    - source: escapeplan_api
      target: ffmpeg_workers
      protocol: "Child Process (spawn)"
      pattern: "Worker Pool"
      description: "Camera stream transcoding management"

  external:
    - service: "IP Cameras (RTSP)"
      protocol: "RTSP over TCP/UDP"
      authentication: "Basic Auth (username/password)"
      pattern: "Streaming"
      description: "Live camera feeds for game monitoring"

    - service: "Raspberry Pi GPIO (future)"
      protocol: "GPIO pins"
      authentication: "None (local hardware)"
      pattern: "Event-Driven"
      description: "Optional puzzle sensor integration"

# ==============================================================================
# DIRECTORY STRUCTURE
# ==============================================================================
directory_structure:
  monorepo_root:
    packages:
      contracts: "Shared types, schema, validation, runtime detection"
    apps:
      escapeplan-api: "Fastify backend API"
      escapeplan-web: "SvelteKit PWA frontend"
    project-docs:
      project-tracking: "TODO.json, HANDOFF.md, session notes, schemas"
      research: "Auth research, competitive analysis"
      DOCS: "DATABASE_SYSTEM.md, API_CONTRACTS_SCHEMA_MANAGEMENT.md"
    scripts: "build-deb.sh for Raspberry Pi packaging"

# ==============================================================================
# PATTERNS - Design patterns and conventions
# ==============================================================================
patterns:
  database_access:
    description: "Repository pattern via Drizzle ORM"
    location: "apps/escapeplan-api/src/state.ts"
    example: "export async function getUserById(id: string): Promise<UserProfile | null>"

  validation:
    description: "Zod schemas for request/response validation"
    location: "packages/contracts/src/index.ts"
    example: "export const createGameSchema = z.object({ name: z.string().min(1), ... })"

  permission_checks:
    description: "Database-driven RBAC via requirePermission() helper"
    location: "apps/escapeplan-api/src/security.ts"
    example: "await requirePermission(userId, 'manage_games')"

  real_time_events:
    description: "Socket.IO event broadcasting to specific rooms/namespaces"
    location: "apps/escapeplan-api/src/socket.ts"
    example: "io.to(`session:${sessionId}`).emit('timer:update', { remaining })"

  offline_command_queue:
    description: "Svelte stores queue commands when offline, replay on reconnect"
    location: "apps/escapeplan-web/src/lib/stores/commandQueue.svelte.ts"
    example: "commandQueue.add({ type: 'SEND_HINT', sessionId, hintId })"

  runtime_detection:
    description: "Zero-config environment detection via filesystem inspection"
    location: "packages/contracts/src/runtime.ts"
    example: "export function isProduction(): boolean"

# ==============================================================================
# ERROR HANDLING
# ==============================================================================
error_handling:
  api_errors:
    pattern: "HTTP status codes with JSON error payloads"
    example: "{ error: 'PERMISSION_DENIED', message: 'Missing manage_games permission' }"

  database_errors:
    pattern: "Drizzle catches SQLite errors, wrap in custom error types"
    example: "throw new ConflictError('Session already active for this room')"

  validation_errors:
    pattern: "Zod validation failures return 400 with field-specific errors"
    example: "{ error: 'VALIDATION_ERROR', issues: [{ path: ['name'], message: 'Required' }] }"

  socket_errors:
    pattern: "Emit error events to client for acknowledgment"
    example: "socket.emit('error', { code: 'SESSION_NOT_FOUND', sessionId })"

  offline_handling:
    pattern: "Queue failed requests in IndexedDB, show toast notification"
    example: "Toast: 'Action queued. Will sync when online.'"

# ==============================================================================
# SECURITY
# ==============================================================================
security:
  authentication:
    mechanism: "Better Auth v1.3.24+ with Argon2id password hashing"
    session_storage: "HttpOnly cookies (better-auth.session_token)"
    session_duration: "7 days (configurable via Better Auth)"
    enforcement: "hooks.server.ts checks session on all (app) routes"

  authorization:
    mechanism: "Database-driven RBAC (roles → role_permissions → permissions)"
    enforcement_layers:
      - "Database triggers (prevent customer from getting operator roles)"
      - "API route guards (requirePermission() middleware)"
      - "Frontend route guards (hooks.server.ts checks user_type)"
      - "UI visibility (components check permissions before rendering)"
    user_type_separation: "user_type field ('operator' | 'customer') enforced via triggers"

  password_security:
    algorithm: "Argon2id (argon2 npm package v0.40.3)"
    parameters: "type: argon2id (default settings)"
    reset_flow: "must_reset_password flag forces reset on first login"

  rate_limiting:
    status: "Not implemented (low priority for offline-first local network)"
    future: "Consider rate limiting login attempts (5 per minute per IP)"

  cors:
    policy: "@fastify/cors configured for trusted origins"
    allowed_origins: "http://localhost:5173 (dev), https://escapeplan.local (prod)"

  credential_encryption:
    mechanism: "libsodium (sodium-native v5.0.9+) for camera credentials"
    key_management: "CAMERA_ENCRYPTION_KEY environment variable (generated on first boot)"

# ==============================================================================
# AGENT STRUCTURE - AI agent workflow
# ==============================================================================
agent_structure:
  main_agent:
    role: "Project orchestrator and architectural decision maker"
    responsibilities:
      - "Read and understand project.yaml, techstack.yaml, TODO.json, HANDOFF.md"
      - "Break down user requests into subtasks"
      - "Decide when to spawn implementation/QA/fix subagents"
      - "Ensure all hard rules are followed"
      - "Update TODO.json and session notes after work completion"
      - "Validate against schemas before finalizing changes"

  implementation_subagent:
    role: "Write production-ready code following architectural patterns"
    responsibilities:
      - "Implement features according to TODO item acceptance criteria"
      - "Follow patterns from project.yaml and techstack.yaml hard rules"
      - "Write tests alongside implementation (minimum 80% coverage)"
      - "Use Drizzle ORM for all database operations"
      - "Validate with Zod schemas before database writes"
      - "Check permissions via requirePermission() before protected actions"
    context_required:
      - "project.yaml (components, patterns, hard_rules)"
      - "techstack.yaml (dependencies, quality_standards)"
      - "TODO item acceptance criteria"
      - "Relevant source files (schema, API routes, components)"
    constraints:
      - "NEVER use mock/placeholder data"
      - "ALWAYS use TypeScript strict mode"
      - "ALWAYS use Svelte 5 runes (not legacy stores)"
      - "NEVER bypass RBAC checks"

  qa_validation_subagent:
    role: "Validate implementation against acceptance criteria and quality standards"
    responsibilities:
      - "Run test suite and verify minimum 80% coverage"
      - "Check TypeScript compilation (pnpm lint)"
      - "Run svelte-check for frontend code"
      - "Validate schemas (project.yaml, techstack.yaml)"
      - "Test permission enforcement (user_type, role boundaries)"
      - "Verify database triggers work correctly"
      - "Check offline command queueing and replay"
    context_required:
      - "TODO item acceptance criteria"
      - "techstack.yaml quality_standards"
      - "Test results and coverage reports"
      - "Schema validation output"
    output_format:
      - "List of acceptance criteria with ✅/❌ status"
      - "Test coverage percentage"
      - "Schema validation results"
      - "List of issues found (if any)"
      - "Recommendation: PASS or FAIL with justification"

  fix_subagent:
    role: "Debug and fix issues found during QA or runtime"
    responsibilities:
      - "Analyze error messages and stack traces"
      - "Identify root cause (logic error, type mismatch, permission issue, etc.)"
      - "Implement minimal fix without introducing new issues"
      - "Add regression test to prevent recurrence"
      - "Re-run QA validation after fix"
    context_required:
      - "Error logs or QA failure report"
      - "Relevant source files"
      - "project.yaml patterns and hard_rules"
      - "techstack.yaml dependencies and standards"
    constraints:
      - "NEVER introduce breaking changes"
      - "ALWAYS add regression test"
      - "ALWAYS re-run QA after fix"

# ==============================================================================
# CHECKPOINTING - When to save agent progress
# ==============================================================================
checkpointing:
  triggers:
    - "After completing a TODO item"
    - "After QA validation (pass or fail)"
    - "Before spawning a subagent"
    - "After fixing a critical bug"
    - "At the end of a work session"
    - "After major refactoring (e.g., auth system optimization)"

  content:
    required_fields:
      - "Session number and date"
      - "TODO items worked on (IDs)"
      - "Work completed (summary)"
      - "Files modified (list with line counts)"
      - "Commands run (validation, tests, builds)"
      - "Issues encountered and resolutions"
      - "Testing evidence (output snippets)"
      - "Next steps"
      - "Hours logged"

  storage:
    location: "project-docs/project-tracking/sessions/SESSION_{#}_NOTES.md"
    format: "Markdown with structured sections (see SESSION_TEMPLATE.md)"

  claude_md_sync:
    required: false
    timing: "Optional - update CLAUDE.md if architectural patterns change"

# ==============================================================================
# HARD RULES - Non-negotiable constraints for agents
# ==============================================================================
hard_rules:
  # Database & Schema
  - "ALWAYS use Drizzle ORM for database operations - no raw SQL except in specific helpers"
  - "ALWAYS reference @escapeplan/contracts for shared types and schema"
  - "ALWAYS use singular table names per Better Auth v1.3+ conventions (user, session, account, verification)"
  - "NEVER use mock or placeholder data - always load from database or seeds"
  - "ALWAYS validate with Zod schemas before database operations"

  # Authentication & Authorization
  - "ALWAYS use Better Auth session enrichment for user context (permissions, role, user_type)"
  - "ALWAYS check user_type field for operator/customer separation"
  - "ALWAYS use database-driven RBAC (roles → role_permissions → permissions tables)"
  - "NEVER bypass permission checks with hardcoded role strings"
  - "ALWAYS use HttpOnly cookies for auth - no localStorage tokens"
  - "ALWAYS test database triggers enforce user_type/role boundaries"

  # Frontend (Svelte)
  - "ALWAYS use Svelte 5 runes ($state, $derived, $effect) - not legacy stores"
  - "NEVER use legacy Svelte stores except for Socket.IO and command queue"
  - "ALWAYS handle offline scenarios (command queueing, cached data)"

  # Environment & Config
  - "ALWAYS use environment auto-detection (@escapeplan/contracts/runtime) - no NODE_ENV"
  - "NEVER commit .env files or hardcoded credentials"
  - "ALWAYS use database-backed system settings (no hardcoded configuration)"

  # Code Quality
  - "ALWAYS use TypeScript strict mode with full type coverage"
  - "ALWAYS write tests for new code (minimum 80% coverage)"
  - "ALWAYS run type checking before committing (pnpm lint, svelte-check)"
  - "NEVER introduce breaking changes without migration plan"

  # Agent Workflow
  - "ALWAYS read project.yaml, techstack.yaml, TODO.json, HANDOFF.md before starting work"
  - "ALWAYS create session notes (SESSION_{#}_NOTES.md) documenting work"
  - "ALWAYS update TODO.json status when completing items"
  - "ALWAYS validate schemas after modifying project.yaml or techstack.yaml"
  - "NEVER skip QA validation step"

# ==============================================================================
# NOTES
# ==============================================================================
notes:
  - "This file is the architectural source of truth - update after major design changes"
  - "See techstack.yaml for technology choices and dependency versions"
  - "See TODO.json for current phase tasks and completion tracking"
  - "See HANDOFF.md for latest project snapshot and session summary"
  - "Monorepo build order: contracts → api → web (enforced via workspace dependencies)"
  - "Zero-configuration deployment: paths auto-detected, settings seeded, no .env required"
  - "Auth system modernized: user table (not operators), user_type field, database RBAC"
  - "Better Auth v1.3.24+ with native singular table names and additionalFields"
  - "Customer portal ready: user_type separation, route guards, permission scoping"
  - "Offline-first: all features work without internet, PWA installable, command queueing"
