name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Prevent concurrent releases
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  PNPM_VERSION: 10.12.4
  NODE_VERSION: 24

jobs:
  # ────────────────────────────────────────────────────────────
  # JOB: Create/update Version Packages PR via Changesets
  # ────────────────────────────────────────────────────────────
  release:
    name: Create Release PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Release Pull Request
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm version
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Log Changesets Output
        if: always()
        run: |
          echo "Has Changesets: ${{ steps.changesets.outputs.hasChangesets }}"
          echo "Published: ${{ steps.changesets.outputs.published }}"
          echo "Published Packages: ${{ steps.changesets.outputs.publishedPackages }}"

      - name: Output Release Info
        if: steps.changesets.outputs.hasChangesets == 'true'
        run: |
          echo "::notice::Release PR created/updated. Review and merge to trigger publish workflow."
