# ============================================================================
# EscapePlan Production Nginx Configuration
# ============================================================================
# Production-ready reverse proxy configuration with:
# - Rate limiting (API, auth, general endpoints)
# - WebSocket support (Socket.IO)
# - Static asset caching
# - Security headers
# - Compression
# ============================================================================

# Upstream definitions
upstream api_backend {
    server localhost:4000 fail_timeout=30s max_fails=3;
    keepalive 32;
}

upstream web_frontend {
    server localhost:3000 fail_timeout=30s max_fails=3;
    keepalive 32;
}

# Rate limiting zones inherited from base OS nginx.conf
# Zones available: api_limit (10r/s), auth_limit (5r/m), general_limit (50r/s), conn_limit
# Zone definitions must be in http block (base OS), not server block (app config)

# ============================================================================
# HTTP Server (Port 80) - Redirect to HTTPS
# ============================================================================
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name escapeplan.local 10.10.10.1 _;

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

# ============================================================================
# HTTPS Server (Port 443) - Primary Application Access
# ============================================================================
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name escapeplan.local 10.10.10.1 _;

    # SSL Certificate Configuration
    ssl_certificate /etc/escapeplan/certs/escapeplan.local.crt;
    ssl_certificate_key /etc/escapeplan/certs/escapeplan.local.key;

    # SSL protocols and ciphers inherited from base OS nginx.conf
    # TLSv1.2, TLSv1.3 with strong ECDHE cipher suites

    # HTTP/2 Settings
    http2_push_preload on;

    # Connection limits (using base OS zone)
    limit_conn conn_limit 50;

    # Timeouts
    client_body_timeout 60s;
    client_header_timeout 60s;
    keepalive_timeout 65s;
    send_timeout 60s;

    # Buffer sizes
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    client_max_body_size 10m;
    large_client_header_buffers 4 8k;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;
    gzip_disable "msie6";

    # Security headers (includes CSP, frame options, XSS protection, etc.)
    include snippets/escapeplan-security.conf;

    # HSTS Header (HTTP Strict Transport Security)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Disable server tokens (inherited from base OS nginx.conf, but explicit here for clarity)
    server_tokens off;

    # Logging
    access_log /var/log/nginx/escapeplan-access.log;
    error_log /var/log/nginx/escapeplan-error.log warn;

    # Auth endpoints with stricter rate limiting
    location ~ ^/api/auth/(sign-in|sign-up|reset-password) {
        limit_req zone=auth_limit burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
    }

    # API endpoints with moderate rate limiting
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Socket.IO WebSocket endpoint
    location /socket.io/ {
        limit_req zone=general_limit burst=30 nodelay;
        limit_req_status 429;

        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # WebSocket-specific timeouts
        proxy_read_timeout 3600s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;

        # Disable buffering for WebSocket
        proxy_buffering off;
    }

    # Static assets caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://web_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cache static assets
        expires 1y;
        add_header Cache-Control "public, immutable";

        # Security headers inherited from escapeplan-security.conf snippet
    }

    # Web frontend with general rate limiting
    location / {
        limit_req zone=general_limit burst=30 nodelay;
        limit_req_status 429;

        proxy_pass http://web_frontend/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Health check endpoint (no rate limiting)
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
